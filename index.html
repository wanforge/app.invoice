<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verifikasi Dokumen Resmi &bull; WanForge Technology</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0 !important; }
  body {
    background: #18181b;
    color: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 11.5px;
    line-height: 1.45;
    padding: 24px 12px;
  }
  .app-shell { max-width: 210mm; margin: 0 auto; }
  .top-search-bar {
    background: #000;
    color: #fff;
    padding: 12px 16px;
    margin-bottom: 20px;
    border: 1px solid #3f3f46;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .top-search-bar .title-tag {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #a1a1aa;
  }
  .mode-switch {
    display: flex;
    gap: 4px;
  }
  .mode-btn {
    background: #27272a;
    color: #fff;
    border: 1px solid #52525b;
    padding: 5px 10px;
    font-size: 10px;
    font-weight: 700;
    cursor: pointer;
    text-transform: uppercase;
  }
  .mode-btn.active {
    background: #fff;
    color: #000;
    border-color: #fff;
  }
  .a4-paper {
    background: #fff;
    width: 100%;
    max-width: 210mm;
    min-height: 297mm;
    margin: 0 auto;
    padding: 24px 28px;
    border: 1px solid #000;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .verified-stamp-banner {
    border: 2px solid #000;
    background: #f4f4f5;
    padding: 8px 12px;
    margin-bottom: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .verified-stamp-banner.invalid {
    background: #fff;
    border-color: #dc2626;
  }
  .stamp-text {
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .stamp-text.valid { color: #16a34a; }
  .stamp-text.invalid { color: #dc2626; }
  .stamp-meta { font-size: 10px; font-family: monospace; color: #52525b; }
  .brand-bar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    border-bottom: 3px solid #000;
    padding-bottom: 14px;
    margin-bottom: 16px;
    gap: 14px;
  }
  .brand-left { display: flex; align-items: flex-start; gap: 12px; }
  .logo-box {
    width: 44px;
    height: 44px;
    background: #000;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 20px;
    flex-shrink: 0;
  }
  .brand-title {
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 0.5px;
    color: #000;
    text-transform: uppercase;
    margin-bottom: 2px;
  }
  .brand-tagline {
    font-size: 10.5px;
    font-weight: 700;
    color: #000;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .brand-sub { font-size: 10px; color: #27272a; line-height: 1.35; max-width: 420px; }
  .doc-badge-wrap { text-align: right; }
  .doc-badge {
    display: inline-block;
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 2px;
    color: #000;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .group-pill {
    display: inline-block;
    font-size: 9.5px;
    font-weight: 800;
    color: #fff;
    background: #000;
    padding: 2px 7px;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }
  .doc-meta-table { margin-left: auto; font-size: 11px; border-collapse: collapse; }
  .doc-meta-table td { padding: 1.5px 3px; }
  .doc-meta-table .lbl { color: #52525b; text-align: right; font-weight: 600; }
  .doc-meta-table .val { font-weight: 800; color: #000; text-align: right; font-family: monospace; }
  .grid-two { display: flex; justify-content: space-between; gap: 14px; margin-bottom: 14px; }
  .card-box { flex: 1; background: #fafafa; border: 1px solid #000; padding: 9px 11px; }
  .card-label {
    font-size: 9px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: #000;
    border-bottom: 1px solid #000;
    padding-bottom: 3px;
    margin-bottom: 5px;
  }
  .card-content { font-size: 10.5px; color: #18181b; line-height: 1.35; }
  .card-content strong { font-size: 12px; color: #000; display: block; margin-bottom: 2px; }
  .items-table { width: 100%; border-collapse: collapse; margin-bottom: 14px; border: 1px solid #000; }
  .items-table th {
    background: #000;
    color: #fff;
    font-size: 10px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    padding: 6px 8px;
    border: 1px solid #000;
  }
  .items-table td { padding: 6px 8px; border: 1px solid #d4d4d8; vertical-align: top; font-size: 10.5px; }
  .items-table tr:nth-child(even) td { background: #f9f9f9; }
  .receipt-table { width: 100%; border-collapse: collapse; margin-bottom: 14px; background: #fff; border: 1px solid #000; }
  .receipt-table td { padding: 8px 12px; border-bottom: 1px solid #d4d4d8; font-size: 11px; }
  .receipt-table tr:last-child td { border-bottom: none; }
  .receipt-label {
    width: 170px;
    color: #000;
    font-weight: 800;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    background: #f4f4f5;
    border-right: 1px solid #000;
  }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .center { text-align: center; }
  .terbilang-box {
    background: #fafafa;
    border: 1px solid #000;
    border-left: 5px solid #000;
    padding: 7px 10px;
    margin-bottom: 14px;
    font-size: 10.5px;
  }
  .terbilang-box strong {
    color: #000;
    text-transform: uppercase;
    font-size: 9px;
    font-weight: 900;
    display: block;
    margin-bottom: 2px;
  }
  .bottom-section { display: flex; justify-content: space-between; gap: 14px; margin-bottom: 14px; }
  .payment-box { flex: 1.1; border: 1px solid #000; padding: 9px 11px; background: #fafafa; font-size: 10px; }
  .payment-box h5 {
    font-size: 9.5px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    border-bottom: 1px solid #000;
    padding-bottom: 3px;
    margin-bottom: 5px;
  }
  .totals-box { flex: 0.9; border: 1px solid #000; background: #fff; }
  .totals-table { width: 100%; border-collapse: collapse; font-size: 10.5px; }
  .totals-table td { padding: 4px 8px; border-bottom: 1px solid #e4e4e7; }
  .totals-table tr:last-child td { border-bottom: none; }
  .totals-table .lbl { color: #52525b; font-weight: 600; }
  .totals-table .val { font-weight: 800; color: #000; text-align: right; }
  .grand-row td {
    background: #f4f4f5;
    border-top: 2px solid #000 !important;
    font-size: 12px;
    font-weight: 900;
  }
  .sign-section {
    display: flex;
    justify-content: space-between;
    margin-top: 14px;
    padding-top: 10px;
    border-top: 1.5px solid #000;
    gap: 16px;
  }
  .notes-col { flex: 1.1; font-size: 10px; }
  .auth-badge {
    margin-top: 6px;
    font-size: 8.5px;
    font-family: monospace;
    border: 1px solid #71717a;
    padding: 3px 6px;
    background: #f4f4f5;
    word-break: break-all;
  }
  .sign-col { flex: 0.9; text-align: right; font-size: 10.5px; }
  .sign-name {
    font-weight: 800;
    color: #000;
    text-decoration: underline;
    text-underline-offset: 2px;
    margin-top: 32px;
  }
  .sign-role { font-size: 9.5px; color: #52525b; }
  .not-found-card { text-align: center; padding: 60px 20px; border: 2px dashed #000; background: #fafafa; }
  @media print {
    body { padding: 0; background: #fff; }
    .top-search-bar { display: none !important; }
    .a4-paper { border: none !important; box-shadow: none !important; padding: 0; }
  }
</style>
</head>
<body>

<div class="app-shell">
  <div class="a4-paper" id="paper">
    <div style="text-align:center; padding: 100px 20px; color:#71717a;">
      <h2 style="font-size:16px; text-transform:uppercase; letter-spacing:1px; color:#000;">Memuat Dokumen Sah...</h2>
      <p style="font-size:11px; margin-top:4px;">Mendekripsi data aman langsung di browser.</p>
    </div>
  </div>
</div>

<script>
  let CURRENT_DOC = null;
  let CURRENT_MODE = 'inv';

  function base64urlToBytes(base64url) {
    let base64 = base64url.replace(/-/g, '+').replace(/_/g, '/');
    while (base64.length % 4) base64 += '=';
    const raw = atob(base64);
    const bytes = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
    return bytes;
  }

  async function decryptDocument(packedBase64url, keyBase64url) {
    const keyBytes = base64urlToBytes(keyBase64url);
    const packed = base64urlToBytes(packedBase64url);

    if (packed.length < 28) throw new Error("Ukuran payload tidak valid");

    const iv = packed.subarray(0, 12);
    const tag = packed.subarray(12, 28);
    const ciphertext = packed.subarray(28);

    // Concat ciphertext + tag untuk Web Crypto AES-GCM
    const encryptedData = new Uint8Array(ciphertext.length + tag.length);
    encryptedData.set(ciphertext, 0);
    encryptedData.set(tag, ciphertext.length);

    const cryptoKey = await window.crypto.subtle.importKey(
      "raw",
      keyBytes,
      { name: "AES-GCM" },
      false,
      ["decrypt"]
    );

    const decryptedBuffer = await window.crypto.subtle.decrypt(
      { name: "AES-GCM", iv: iv, tagLength: 128 },
      cryptoKey,
      encryptedData
    );

    const dec = new TextDecoder().decode(decryptedBuffer);
    return JSON.parse(dec);
  }

  function fmtRupiah(num) {
    return 'Rp ' + Math.round(Number(num) || 0).toLocaleString('id-ID');
  }

  function switchViewMode(mode) {
    CURRENT_MODE = mode;
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    if (CURRENT_DOC) renderPaper();
  }

  function renderPaper() {
    const doc = CURRENT_DOC;
    const paper = document.getElementById('paper');
    if (!doc) return;

    const isKwt = CURRENT_MODE === 'kwt';
    const isPnw = CURRENT_MODE === 'pnw';
    const isInv = CURRENT_MODE === 'inv';

    let title = 'INVOICE RESMI';
    let docNumber = doc.meta.doc_number_inv;
    if (isKwt) {
      title = 'KWITANSI RESMI (TANDA TERIMA)';
      docNumber = doc.meta.doc_number_kwt;
    } else if (isPnw) {
      title = 'PENAWARAN BIAYA (QUOTATION)';
      docNumber = doc.meta.doc_number_pnw;
    }

    paper.innerHTML = `
      <div class="verified-stamp-banner">
        <div class="stamp-text valid">✓ DOKUMEN RESMI TERVERIFIKASI ASLI (ZERO-KNOWLEDGE DECRYPTED)</div>
        <div class="stamp-meta">LEDGER HASH: ${doc.meta.hash.slice(0, 24)}...</div>
      </div>

      <div class="brand-bar">
        <div class="brand-left">
          <div class="logo-box">${doc.company.logoText || 'W'}</div>
          <div>
            <div class="brand-title">${doc.company.legalName}</div>
            <div class="brand-tagline">${doc.company.businessField || 'Technology & Engineering'}</div>
            <div class="brand-sub">
              ${doc.company.address}<br>
              Telp/WA: <strong>${doc.company.phone}</strong> &bull; Email: <strong>${doc.company.email}</strong>
            </div>
          </div>
        </div>
        <div class="doc-badge-wrap">
          <div class="doc-badge">${title}</div><br>
          <div class="group-pill">${doc.company.code} DIVISION</div>
          <table class="doc-meta-table">
            <tr><td class="lbl">No. Dokumen:</td><td class="val">${docNumber}</td></tr>
            ${isKwt ? `<tr><td class="lbl">Ref. Invoice:</td><td class="val">${doc.meta.doc_number_inv}</td></tr>` : ''}
            <tr><td class="lbl">Tanggal:</td><td class="val">${doc.meta.date}</td></tr>
            ${isInv ? `<tr><td class="lbl">Jatuh Tempo:</td><td class="val">${doc.meta.due_date}</td></tr>` : ''}
            ${isPnw ? `<tr><td class="lbl">Berlaku s/d:</td><td class="val">${doc.meta.valid_until}</td></tr>` : ''}
          </table>
        </div>
      </div>

      ${isKwt ? `
        <table class="receipt-table">
          <tr>
            <td class="receipt-label">Telah Terima Dari</td>
            <td>
              <strong>${doc.meta.to}</strong>
              ${doc.meta.to_address && doc.meta.to_address !== '-' ? `<br><span style="color:#52525b;">${doc.meta.to_address}</span>` : ''}
            </td>
          </tr>
          <tr>
            <td class="receipt-label">Untuk Pembayaran</td>
            <td><strong>${doc.items.map(i => i.desc).join(', ') || doc.meta.notes || 'Pelunasan Layanan'}</strong></td>
          </tr>
          <tr>
            <td class="receipt-label">Metode Pembayaran</td>
            <td>Transfer Bank ${doc.company.bank}</td>
          </tr>
          <tr>
            <td class="receipt-label">Jumlah Bersih Lunas</td>
            <td><div style="font-size:16px; font-weight:900; color:#000;">${fmtRupiah(doc.totals.grandTotal)}</div></td>
          </tr>
        </table>
      ` : `
        <div class="grid-two">
          <div class="card-box">
            <div class="card-label">Ditujukan Kepada (Client):</div>
            <div class="card-content">
              <strong>${doc.meta.to}</strong>
              ${doc.meta.to_address && doc.meta.to_address !== '-' ? `${doc.meta.to_address}<br>` : ''}
              ${doc.meta.to_contact && doc.meta.to_contact !== '-' ? `Kontak: ${doc.meta.to_contact}` : ''}
            </div>
          </div>
          <div class="card-box">
            <div class="card-label">Instruksi Rekening Pembayaran:</div>
            <div class="card-content">
              Rekening Resmi Terdaftar:<br>
              <strong>${doc.company.bank}</strong>
            </div>
          </div>
        </div>

        <table class="items-table">
          <thead>
            <tr>
              <th class="center" style="width:28px">#</th>
              <th>Deskripsi Layanan / Deliverables</th>
              <th class="num" style="width:45px">Qty</th>
              <th class="num" style="width:110px">Harga Satuan</th>
              <th class="num" style="width:120px">Total</th>
            </tr>
          </thead>
          <tbody>
            ${(doc.items || []).map((it, idx) => `
              <tr>
                <td class="center">${idx + 1}</td>
                <td><strong>${it.desc}</strong></td>
                <td class="num">${it.qty}</td>
                <td class="num">${fmtRupiah(it.price)}</td>
                <td class="num">${fmtRupiah(it.total)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>

        <div class="bottom-section">
          <div class="payment-box">
            <h5>Ketentuan Sah & Rekening Pembayaran</h5>
            <div>Pembayaran sah hanya diakui jika ditransfer ke rekening resmi:</div>
            <div style="background:#fff; border:1px solid #000; padding:5px; margin-top:4px;">
              <strong>${doc.company.bank}</strong>
            </div>
          </div>
          <div class="totals-box">
            <table class="totals-table">
              <tr><td class="lbl">Subtotal</td><td class="val">${fmtRupiah(doc.totals.grossSubtotal)}</td></tr>
              ${doc.totals.totalDiscount > 0 ? `<tr><td class="lbl">Diskon</td><td class="val">-${fmtRupiah(doc.totals.totalDiscount)}</td></tr>` : ''}
              <tr class="grand-row"><td>Total Tagihan</td><td class="val">${fmtRupiah(doc.totals.grandTotal)}</td></tr>
            </table>
          </div>
        </div>
      `}

      <div class="sign-section">
        <div class="notes-col">
          ${isKwt ? '<div style="display:inline-block; border:2px solid #000; padding:2px 8px; font-weight:900; letter-spacing:2px; margin-bottom:6px;">LUNAS</div>' : ''}
          <div>* Dokumen ini terdaftar resmi pada ledger kriptografis <strong>${doc.company.legalName}</strong>.</div>
          <div class="auth-badge">
            LEDGER HASH: <strong>${doc.meta.hash}</strong>
          </div>
        </div>
        <div class="sign-col">
          <div>${doc.company.city}, ${doc.meta.date}</div>
          <div style="font-weight: 700; margin-top: 2px;">Otorisasi Resmi,</div>
          <div class="sign-name">${doc.company.owner}</div>
          <div class="sign-role">${doc.company.role} &bull; ${doc.company.name}</div>
        </div>
      </div>
    `;
  }

  async function initZeroKnowledgeVerification() {
    const url = new URL(window.location.href);
    const docId = url.searchParams.get('id') || url.searchParams.get('no');

    // Ambil kunci rahasia dari URL fragment (#k=...)
    let key = '';
    if (window.location.hash) {
      const hashParams = new URLSearchParams(window.location.hash.substring(1));
      key = hashParams.get('k') || hashParams.get('key');
    }

    if (!docId || !key) {
      document.getElementById('paper').innerHTML = `
        <div class="not-found-card" style="padding: 100px 20px; background: #ffffff; border: 1px solid #27272a;">
          <div style="width:52px; height:52px; margin:0 auto 16px auto; background:#000000; display:flex; align-items:center; justify-content:center; border-radius:10px;">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><rect x="7" y="7" width="3" height="3"></rect><rect x="14" y="7" width="3" height="3"></rect><rect x="7" y="14" width="3" height="3"></rect></svg>
          </div>
          <h3 style="color:#000000; font-size:16px; font-weight:900; letter-spacing:0.5px; text-transform:uppercase; margin-bottom:8px;">
            Akses Verifikasi Khusus Pindai QR Code
          </h3>
          <p style="font-size:11px; color:#52525b; max-width:440px; margin:0 auto 14px auto; line-height:1.5;">
            Halaman ini dilindungi enkripsi kriptografis (Zero-Knowledge). Tidak ada form pencarian manual untuk mencegah akses data tanpa izin.
          </p>
          <div style="font-size:9.5px; font-weight:700; color:#000000; background:#f4f4f5; padding:8px 14px; display:inline-block; border:1px solid #e4e4e7;">
            Silakan pindai QR Code resmi yang tertera pada lembar dokumen cetak atau PDF Anda.
          </div>
        </div>
      `;
      return;
    }

    try {
      // Fetch ciphertext terenkripsi (file .enc)
      const res = await fetch('d/' + encodeURIComponent(docId) + '.enc');
      if (!res.ok) throw new Error("Dokumen tidak ditemukan atau file terenkripsi hilang.");
      const ciphertext = await res.text();

      // Dekripsi di client
      CURRENT_DOC = await decryptDocument(ciphertext.trim(), key.trim());
      renderPaper();
    } catch (err) {
      document.getElementById('paper').innerHTML = `
        <div class="verified-stamp-banner invalid">
          <div class="stamp-text invalid">✗ GAGAL VERIFIKASI / KUNCI TIDAK COCOK</div>
          <div class="stamp-meta">${err.message}</div>
        </div>
        <div class="not-found-card">
          <h3 style="color:#dc2626;">Dokumen Tidak Dapat Divalidasi</h3>
          <p style="font-size:12px; color:#52525b; max-width:440px; margin:0 auto;">
            Kunci kriptografi tidak cocok atau dokumen telah dimanipulasi dari versi aslinya.
          </p>
        </div>
      `;
    }
  }

  window.addEventListener('DOMContentLoaded', initZeroKnowledgeVerification);
</script>
</body>
</html>
