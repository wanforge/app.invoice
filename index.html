<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verifikasi Dokumen Resmi - WanForge Technology</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0 !important; }
  body {
    background: #18181b;
    margin: 0;
    padding: 24px 12px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .app-shell {
    max-width: 210mm;
    margin: 0 auto;
  }
  .viewer-toolbar {
    background: #000000;
    color: #ffffff;
    padding: 10px 16px;
    margin-bottom: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border: 1px solid #333333;
  }
  .viewer-title {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #a1a1aa;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .verified-badge {
    background: #16a34a;
    color: #ffffff;
    font-size: 8.5px;
    font-weight: 800;
    padding: 2px 7px;
    letter-spacing: 0.8px;
  }
  .tab-group {
    display: flex;
    gap: 6px;
  }
  .tab-btn {
    background: #27272a;
    color: #ffffff;
    border: 1px solid #52525b;
    padding: 5px 12px;
    font-size: 10px;
    font-weight: 800;
    text-transform: uppercase;
    cursor: pointer;
  }
  .tab-btn.active {
    background: #ffffff;
    color: #000000;
    border-color: #ffffff;
  }
  .print-btn {
    background: #ffffff;
    color: #000000;
    border: none;
    padding: 5px 12px;
    font-size: 10px;
    font-weight: 800;
    text-transform: uppercase;
    cursor: pointer;
    margin-left: 8px;
  }
  .paper-canvas {
    background: #ffffff;
    width: 100%;
    max-width: 210mm;
    min-height: 297mm;
    margin: 0 auto;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    overflow: hidden;
  }
  .paper-canvas iframe {
    width: 100%;
    height: 297mm;
    border: none;
    display: block;
    background: #ffffff;
  }
  @media print {
    body { padding: 0; background: #fff; }
    .viewer-toolbar { display: none !important; }
    .paper-canvas { box-shadow: none !important; width: 100% !important; }
  }
</style>
</head>
<body>

<div class="app-shell">
  <div class="viewer-toolbar" id="toolbar" style="display:none;">
    <div class="viewer-title">
      <span class="verified-badge">✓ SAH TERVERIFIKASI</span>
      <span>WANFORGE TECHNOLOGY</span>
    </div>
    <div style="display:flex; align-items:center;">
      <div class="tab-group" id="tabGroup">
        <button class="tab-btn active" id="btnInv" onclick="switchDoc('inv')">Faktur</button>
        <button class="tab-btn" id="btnKwt" onclick="switchDoc('kwt')">Kwitansi</button>
        <button class="tab-btn" id="btnPnw" onclick="switchDoc('pnw')">Penawaran</button>
      </div>
      <button class="print-btn" onclick="printDoc()">Cetak A4</button>
    </div>
  </div>

  <div class="paper-canvas" id="canvas">
    <div style="text-align:center; padding: 120px 20px; color:#a1a1aa;">
      <h3 style="font-size:15px; color:#ffffff; margin-bottom:8px;">MEMVERIFIKASI DOKUMEN...</h3>
      <p style="font-size:11px;">Mendekripsi lembar dokumen sah langsung di browser Anda.</p>
    </div>
  </div>
</div>

<script>
  let CURRENT_PAYLOAD = null;
  let ACTIVE_TAB = 'inv';

  function base64urlToBytes(base64url) {
    let base64 = base64url.replace(/-/g, '+').replace(/_/g, '/');
    while (base64.length % 4) base64 += '=';
    const raw = atob(base64);
    const bytes = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
    return bytes;
  }

  async function decryptDocument(packedBase64url, keyBase64url) {
    const keyBytes = base64urlToBytes(keyBase64url);
    const packed = base64urlToBytes(packedBase64url);

    if (packed.length < 28) throw new Error("Ukuran payload tidak valid");

    const iv = packed.subarray(0, 12);
    const tag = packed.subarray(12, 28);
    const ciphertext = packed.subarray(28);

    const encryptedData = new Uint8Array(ciphertext.length + tag.length);
    encryptedData.set(ciphertext, 0);
    encryptedData.set(tag, ciphertext.length);

    const cryptoKey = await window.crypto.subtle.importKey(
      "raw",
      keyBytes,
      { name: "AES-GCM" },
      false,
      ["decrypt"]
    );

    const decryptedBuffer = await window.crypto.subtle.decrypt(
      { name: "AES-GCM", iv: iv, tagLength: 128 },
      cryptoKey,
      encryptedData
    );

    const dec = new TextDecoder().decode(decryptedBuffer);
    return JSON.parse(dec);
  }

  function switchDoc(mode) {
    ACTIVE_TAB = mode;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    if (mode === 'inv') document.getElementById('btnInv').classList.add('active');
    if (mode === 'kwt') document.getElementById('btnKwt').classList.add('active');
    if (mode === 'pnw') document.getElementById('btnPnw').classList.add('active');
    renderCurrentFrame();
  }

  function renderCurrentFrame() {
    if (!CURRENT_PAYLOAD) return;
    let html = CURRENT_PAYLOAD.invHtml;
    if (ACTIVE_TAB === 'kwt') html = CURRENT_PAYLOAD.kwtHtml;
    if (ACTIVE_TAB === 'pnw') html = CURRENT_PAYLOAD.pnwHtml;

    const canvas = document.getElementById('canvas');
    canvas.innerHTML = '<iframe id="docFrame"></iframe>';
    const frame = document.getElementById('docFrame');
    frame.contentWindow.document.open();
    frame.contentWindow.document.write(html);
    frame.contentWindow.document.close();

    // Auto fit height
    setTimeout(() => {
      try {
        const h = frame.contentWindow.document.body.scrollHeight;
        if (h > 0) frame.style.height = h + 'px';
      } catch(_) {}
    }, 200);
  }

  function printDoc() {
    const frame = document.getElementById('docFrame');
    if (frame && frame.contentWindow) {
      frame.contentWindow.print();
    } else {
      window.print();
    }
  }

  async function initZeroKnowledgeVerification() {
    const url = new URL(window.location.href);
    const docId = url.searchParams.get('id') || url.searchParams.get('no');

    let key = '';
    if (window.location.hash) {
      const hashParams = new URLSearchParams(window.location.hash.substring(1));
      key = hashParams.get('k') || hashParams.get('key');
    }

    // Jika dibuka langsung tanpa QR scan (tidak ada id / tidak ada key): Redirect langsung ke wanforge.asia
    if (!docId || !key) {
      window.location.replace("https://wanforge.asia");
      return;
    }

    try {
      const res = await fetch('d/' + encodeURIComponent(docId) + '.enc');
      if (!res.ok) throw new Error("Dokumen terenkripsi tidak ditemukan di server.");
      const ciphertext = await res.text();

      CURRENT_PAYLOAD = await decryptDocument(ciphertext.trim(), key.trim());

      // Auto pilih tab jika ada parameter query
      if (window.location.search.includes('type=kwt')) ACTIVE_TAB = 'kwt';
      else if (window.location.search.includes('type=pnw')) ACTIVE_TAB = 'pnw';
      else ACTIVE_TAB = 'inv';

      document.getElementById('toolbar').style.display = 'flex';
      switchDoc(ACTIVE_TAB);
    } catch (err) {
      document.getElementById('canvas').innerHTML = `
        <div style="text-align:center; padding:100px 20px; background:#fff;">
          <h3 style="color:#dc2626; font-size:16px; font-weight:900; margin-bottom:8px;">DOKUMEN TIDAK VALID / GAGAL VERIFIKASI</h3>
          <p style="font-size:11px; color:#52525b; max-width:440px; margin:0 auto;">
            Kunci kriptografis tidak cocok atau data transaksi telah dimodifikasi.
          </p>
        </div>
      `;
    }
  }

  window.addEventListener('DOMContentLoaded', initZeroKnowledgeVerification);
</script>
</body>
</html>
